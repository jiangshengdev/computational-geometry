[package]
name = "computational-geometry"
version = "0.1.0"
edition = "2024"
default-run = "computational-geometry"

[[bin]]
name = "axum"
path = "api/axum.rs"

[[test]]
name = "triangulation_performance"
path = "tests/algorithms/triangulation/performance.rs"

[[test]]
name = "triangulation"
path = "tests/algorithms/triangulation/triangulation.rs"

[[test]]
name = "convex_polygon_intersection"
path = "tests/algorithms/convex_polygon_intersection/intersection.rs"

[[test]]
name = "convex_hull"
path = "tests/algorithms/convex_hull/andrew/convex_hull.rs"

[[test]]
name = "sweep"
path = "tests/algorithms/segment_intersection/bo/sweep.rs"

[[test]]
name = "performance"
path = "tests/algorithms/segment_intersection/performance.rs"

[[test]]
name = "validation"
path = "tests/algorithms/segment_intersection/validation.rs"

[[test]]
name = "trace"
path = "tests/algorithms/segment_intersection/bo/trace.rs"

[[test]]
name = "trace_lifecycle"
path = "tests/http/trace_lifecycle.rs"

[dependencies]
axum = "0.8.9"
num-rational = "0.4.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "sync"] }
tokio-stream = { version = "0.1.19", default-features = false }
tower = "0.5"
vercel_runtime = { version = "2.4", features = ["axum"] }
