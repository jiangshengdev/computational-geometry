[package]
name = "computational-geometry"
version = "0.1.0"
edition = "2024"
default-run = "computational-geometry"

[[bin]]
name = "axum"
path = "api/axum.rs"

[dependencies]
axum = "0.8.9"
num-rational = "0.4.2"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net"] }
tower = "0.5"
vercel_runtime = { version = "2.4", features = ["axum"] }
