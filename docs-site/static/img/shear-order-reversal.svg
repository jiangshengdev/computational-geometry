<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">剪切使两个事件的横向顺序颠倒</title>
  <desc id="desc">剪切前，A 为 (0, 200)，B 为 (1, 0)。经 x′ = x + 0.01y 变换后，A′ 为 (2, 200)，B′ 为 (1, 0)，左右顺序颠倒。两幅图使用相同尺度，横轴与纵轴尺度不同。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="960" height="420" rx="12" fill="#f8fafc"/>
  <g font-family="system-ui, sans-serif" fill="#172033">
    <text x="240" y="42" text-anchor="middle" font-size="23" font-weight="600">剪切前</text>
    <text x="720" y="42" text-anchor="middle" font-size="23" font-weight="600">剪切后（s = 0.01）</text>
    <g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M80 290 H420"/>
      <path d="M100 310 V75"/>
      <path d="M560 290 H900"/>
      <path d="M580 310 V75"/>
    </g>
    <g font-size="18">
      <text x="427" y="296">x</text>
      <text x="78" y="78">y</text>
      <text x="908" y="296">x′</text>
      <text x="551" y="78">y′</text>
    </g>
    <g stroke="#2563eb" stroke-width="2" stroke-dasharray="6 5">
      <path d="M100 120 V290"/>
      <path d="M820 120 V290"/>
    </g>
    <g fill="#2563eb">
      <circle cx="100" cy="120" r="7"/>
      <circle cx="820" cy="120" r="7"/>
      <text x="117" y="111" font-size="21">A (0, 200)</text>
      <text x="802" y="111" text-anchor="end" font-size="21">A′ (2, 200)</text>
    </g>
    <g fill="#c2410c">
      <circle cx="220" cy="290" r="7"/>
      <circle cx="700" cy="290" r="7"/>
      <text x="220" y="268" text-anchor="middle" font-size="21">B (1, 0)</text>
      <text x="700" y="268" text-anchor="middle" font-size="21">B′ (1, 0)</text>
    </g>
    <g font-size="17" text-anchor="middle">
      <text x="100" y="333">0</text>
      <text x="220" y="333">1</text>
      <text x="340" y="333">2</text>
      <text x="580" y="333">0</text>
      <text x="700" y="333">1</text>
      <text x="820" y="333">2</text>
    </g>
    <g font-size="22" text-anchor="middle" font-weight="600">
      <text x="240" y="376">横向顺序：A → B</text>
      <text x="720" y="376">横向顺序：B′ → A′</text>
    </g>
    <text x="480" y="405" text-anchor="middle" font-size="14" fill="#475569">示意图：横轴与纵轴采用不同尺度</text>
  </g>
</svg>
